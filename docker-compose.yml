# ============================================================
#  Desarrollo local — app + PostgreSQL
#  Levantar con:  docker compose up
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Expuesto solo en desarrollo, para poder inspeccionar la base
      # con pgAdmin/DBeaver desde Windows.
      # 5433 en el host: el 5432 ya lo ocupa el PostgreSQL instalado en Windows.
      # Dentro de la red de compose se sigue usando el 5432 de siempre.
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      AUTH_SESSIONS_PATH: /datos/auth_sessions
      UPLOADS_PATH: /datos/uploads
      LOG_LEVEL: ${LOG_LEVEL}
    volumes:
      # Las sesiones de WhatsApp y los archivos subidos DEBEN sobrevivir
      # a un redeploy: sin esto habria que re-escanear el QR cada vez.
      - auth_sessions:/datos/auth_sessions
      - uploads:/datos/uploads
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  auth_sessions:
  uploads:
